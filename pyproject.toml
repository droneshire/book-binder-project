[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-page-edges"
version = "0.1.0"
description = "Streamlit tool for applying forced page-edge artwork to print PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40",
  "PyMuPDF>=1.23",
  "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
