name: Release Matrix Build

on:
  workflow_run:
    workflows: ["Python CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-binaries:
    if: >-
      ${
        {
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        }
      }
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build PyInstaller binary
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm --onefile \
            --name "book-page-edges-${{ matrix.platform }}" \
            --collect-all streamlit \
            --collect-all fitz \
            --collect-all PIL \
            streamlit_app.py

          if [ "${{ matrix.platform }}" = "windows" ]; then
            ASSET_PATH="dist/book-page-edges-${{ matrix.platform }}.exe"
            ASSET_NAME="book-page-edges-${{ matrix.platform }}.exe"
          else
            ASSET_PATH="dist/book-page-edges-${{ matrix.platform }}"
            ASSET_NAME="book-page-edges-${{ matrix.platform }}"
          fi

          echo "ASSET_PATH=${ASSET_PATH}" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Set release metadata
        shell: bash
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          echo "TAG_NAME=pyinstaller-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=PyInstaller Build ${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          prerelease: false
          body: |
            Download the binary for your platform:

            - Linux: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/book-page-edges-linux
            - macOS: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/book-page-edges-macos
            - Windows: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/book-page-edges-windows.exe
          files: |
            release-assets/book-page-edges-linux
            release-assets/book-page-edges-macos
            release-assets/book-page-edges-windows.exe
